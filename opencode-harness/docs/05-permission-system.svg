<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"></path>
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="420" fill="#ffffff"></rect>

  <text x="390" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">
    Permission System — Three Outcomes
  </text>
  <text x="390" y="49" text-anchor="middle" font-size="12.5" fill="#6b6b6b">
    05-permission-system/permissions.ts — upgrades topics 2-4's "always allow" stub into a real ruleset
  </text>

  <rect x="280" y="65" width="220" height="55" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.7"></rect>
  <text x="390" y="90" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">ctx.ask({ permission,</text>
  <text x="390" y="107" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">patterns, always })</text>

  <line x1="390" y1="120" x2="390" y2="148" stroke="#4a4a4a" stroke-width="1.6" marker-end="url(#arrow5)"></line>

  <polygon points="390,152 500,205 390,258 280,205" fill="#fff8e6" stroke="#c9960f" stroke-width="1.6"></polygon>
  <text x="390" y="200" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a5c00">check against</text>
  <text x="390" y="216" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a5c00">ruleset</text>

  <!-- allow -->
  <line x1="280" y1="205" x2="150" y2="205" stroke="#2f9e44" stroke-width="1.6" marker-end="url(#arrow5)"></line>
  <text x="220" y="196" text-anchor="middle" font-size="11" font-weight="700" fill="#2f9e44">allow</text>
  <rect x="10" y="180" width="140" height="50" rx="9" fill="#eafaf0" stroke="#2f9e44" stroke-width="1.5"></rect>
  <text x="80" y="201" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f7a37">Proceeds</text>
  <text x="80" y="217" text-anchor="middle" font-size="10.5" fill="#1f7a37">silently</text>

  <!-- deny -->
  <line x1="500" y1="205" x2="630" y2="205" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow5)"></line>
  <text x="565" y="196" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">deny</text>
  <rect x="632" y="180" width="140" height="50" rx="9" fill="#fdeee7" stroke="#e8590c" stroke-width="1.5"></rect>
  <text x="702" y="198" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b8460f">Tool fails</text>
  <text x="702" y="214" text-anchor="middle" font-size="10" fill="#b8460f">error → history</text>

  <!-- ask -->
  <line x1="390" y1="258" x2="390" y2="286" stroke="#c9960f" stroke-width="1.6" marker-end="url(#arrow5)"></line>
  <text x="405" y="278" font-size="11" font-weight="700" fill="#c9960f">ask</text>

  <rect x="270" y="288" width="240" height="55" rx="10" fill="#fff8e6" stroke="#c9960f" stroke-width="1.6"></rect>
  <text x="390" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a5c00">Blocks — real interactive</text>
  <text x="390" y="326" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a5c00">y/n prompt in terminal</text>

  <line x1="330" y1="343" x2="150" y2="380" stroke="#2f9e44" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow5)"></line>
  <text x="200" y="365" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2f9e44">approved</text>

  <line x1="450" y1="343" x2="702" y2="240" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow5)"></line>
  <text x="600" y="300" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c0392b">rejected</text>

  <text x="390" y="395" text-anchor="middle" font-size="11" fill="#6b6b6b">the "always" list short-circuits this whole check — blanket-allowed patterns skip the prompt entirely</text>

</svg>
