<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 730" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"></path>
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="730" fill="#ffffff"></rect>

  <text x="390" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">
    This Demo's WebSocket / TUI — the Full Request Flow
  </text>
  <text x="390" y="49" text-anchor="middle" font-size="12.5" fill="#6b6b6b">
    10-websocket-tui/server.ts + client.ts — no polling, events push as they happen*
  </text>

  <rect x="290" y="65" width="200" height="46" rx="9" fill="#fbeceb" stroke="#da3743" stroke-width="1.5"></rect>
  <text x="390" y="93" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">User types a message</text>

  <line x1="390" y1="111" x2="390" y2="136" stroke="#4a4a4a" stroke-width="1.6" marker-end="url(#arrow10)"></line>

  <rect x="270" y="138" width="240" height="42" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"></rect>
  <text x="390" y="164" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">TUI sends over WebSocket*</text>

  <line x1="390" y1="180" x2="390" y2="205" stroke="#4a4a4a" stroke-width="1.6" marker-end="url(#arrow10)"></line>

  <rect x="250" y="207" width="280" height="46" rx="9" fill="#f5f4f2" stroke="#1a1a1a" stroke-width="1.5"></rect>
  <text x="390" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Session.send() → SQLite</text>
  <text x="390" y="243" text-anchor="middle" font-size="10.5" fill="#6b6b6b">appends message, builds history</text>

  <line x1="390" y1="253" x2="390" y2="278" stroke="#4a4a4a" stroke-width="1.6" marker-end="url(#arrow10)"></line>

  <rect x="240" y="280" width="300" height="46" rx="9" fill="#fff8e6" stroke="#c9960f" stroke-width="1.6"></rect>
  <text x="390" y="302" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a5c00">Agent loop streams LLM response</text>
  <text x="390" y="317" text-anchor="middle" font-size="10.5" fill="#7a5c00">via the AI SDK</text>

  <line x1="390" y1="326" x2="390" y2="351" stroke="#4a4a4a" stroke-width="1.6" marker-end="url(#arrow10)"></line>

  <polygon points="390,355 500,398 390,441 280,398" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"></polygon>
  <text x="390" y="393" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a1a">text token or</text>
  <text x="390" y="408" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a1a">tool_call?</text>

  <!-- text branch -->
  <line x1="280" y1="398" x2="150" y2="398" stroke="#2f9e44" stroke-width="1.5" marker-end="url(#arrow10)"></line>
  <text x="165" y="389" font-size="10.5" font-weight="700" fill="#2f9e44">text</text>
  <rect x="10" y="373" width="140" height="50" rx="9" fill="#eafaf0" stroke="#2f9e44" stroke-width="1.4"></rect>
  <text x="80" y="393" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f7a37">Streamed over WebSocket*</text>
  <text x="80" y="408" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f7a37">→ TUI renders</text>

  <!-- tool branch -->
  <line x1="500" y1="398" x2="630" y2="398" stroke="#da3743" stroke-width="1.5" marker-end="url(#arrow10)"></line>
  <text x="555" y="389" font-size="10.5" font-weight="700" fill="#da3743">tool_call</text>
  <rect x="632" y="373" width="140" height="50" rx="9" fill="#fbeceb" stroke="#da3743" stroke-width="1.4"></rect>
  <text x="702" y="393" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">ToolRegistry</text>
  <text x="702" y="408" text-anchor="middle" font-size="10" fill="#6b6b6b">.execute()</text>

  <line x1="702" y1="423" x2="702" y2="450" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow10)"></line>
  <rect x="587" y="452" width="200" height="76" rx="9" fill="#f5f4f2" stroke="#1a1a1a" stroke-width="1.4"></rect>
  <text x="687" y="472" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a1a1a">check Permission rules</text>
  <text x="687" y="488" text-anchor="middle" font-size="10.5" fill="#6b6b6b">(ask user if needed)</text>
  <text x="687" y="504" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a1a1a">run the tool</text>
  <text x="687" y="519" text-anchor="middle" font-size="10.5" fill="#6b6b6b">edit / shell / fetch / ...</text>

  <path d="M120,423 C 120,560 320,585 355,560" fill="none" stroke="#2f9e44" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arrow10)"></path>

  <path d="M687,528 C 687,585 460,585 425,560" fill="none" stroke="#da3743" stroke-width="1.6" marker-end="url(#arrow10)"></path>
  <text x="500" y="575" text-anchor="middle" font-size="10.5" font-weight="700" fill="#da3743">tool_result appended → loop back to LLM</text>

  <rect x="260" y="590" width="260" height="50" rx="10" fill="#eafaf0" stroke="#2f9e44" stroke-width="1.6"></rect>
  <text x="390" y="613" text-anchor="middle" font-size="12" font-weight="700" fill="#1f7a37">stop_reason="end_turn"</text>
  <text x="390" y="629" text-anchor="middle" font-size="11" fill="#1f7a37">session done</text>

  <rect x="50" y="662" width="680" height="56" rx="9" fill="#f5f4f2" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="4,3"></rect>
  <text x="390" y="682" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4a4a4a">* Deviation, verified against the live source: real opencode's general event stream</text>
  <text x="390" y="697" text-anchor="middle" font-size="10.5" fill="#4a4a4a">(GET /event) is Server-Sent Events, not WebSocket — WebSocket there is scoped only</text>
  <text x="390" y="712" text-anchor="middle" font-size="10.5" fill="#4a4a4a">to the embedded terminal (pty), which genuinely needs full-duplex.</text>

</svg>
