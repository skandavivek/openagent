<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 660" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"></path>
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="660" fill="#ffffff"></rect>

  <text x="390" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">
    Tools — Anatomy &amp; Permission Flow
  </text>
  <text x="390" y="49" text-anchor="middle" font-size="12.5" fill="#6b6b6b">
    02-tools/tools.ts — every tool is validate → permission → execute → output, in that order
  </text>

  <!-- LLM emits tool-call -->
  <rect x="290" y="65" width="200" height="55" rx="10" fill="#fbeceb" stroke="#da3743" stroke-width="1.5"></rect>
  <text x="390" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">LLM emits tool-call</text>
  <text x="390" y="107" text-anchor="middle" font-size="11" fill="#6b6b6b">{ name, input }</text>

  <line x1="390" y1="120" x2="390" y2="148" stroke="#4a4a4a" stroke-width="1.6" marker-end="url(#arrow2)"></line>

  <!-- Validate -->
  <rect x="290" y="150" width="200" height="50" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"></rect>
  <text x="390" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Validate input</text>
  <text x="390" y="188" text-anchor="middle" font-size="11" fill="#6b6b6b">against JSON schema</text>

  <!-- invalid branch -->
  <line x1="490" y1="175" x2="560" y2="175" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow2)"></line>
  <text x="500" y="167" font-size="10.5" font-weight="700" fill="#c0392b">invalid</text>
  <rect x="562" y="150" width="190" height="50" rx="9" fill="#fdeee7" stroke="#e8590c" stroke-width="1.4"></rect>
  <text x="657" y="170" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b8460f">InvalidArgumentsError</text>
  <text x="657" y="186" text-anchor="middle" font-size="10.5" fill="#b8460f">fed back to LLM as retry</text>

  <line x1="390" y1="200" x2="390" y2="228" stroke="#4a4a4a" stroke-width="1.6" marker-end="url(#arrow2)"></line>
  <text x="405" y="220" font-size="10.5" font-weight="700" fill="#2f9e44">valid</text>

  <!-- Permission diamond -->
  <polygon points="390,232 500,282 390,332 280,282" fill="#fff8e6" stroke="#c9960f" stroke-width="1.6"></polygon>
  <text x="390" y="277" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a5c00">ctx.ask()</text>
  <text x="390" y="293" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a5c00">permission check</text>

  <!-- allow -> execute -->
  <line x1="390" y1="332" x2="390" y2="360" stroke="#4a4a4a" stroke-width="1.6" marker-end="url(#arrow2)"></line>
  <text x="405" y="352" font-size="10.5" font-weight="700" fill="#2f9e44">allow</text>

  <!-- deny -> error -->
  <line x1="500" y1="282" x2="575" y2="282" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow2)"></line>
  <text x="512" y="274" font-size="10.5" font-weight="700" fill="#c0392b">deny</text>

  <!-- ask -> block -->
  <line x1="280" y1="282" x2="205" y2="282" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow2)"></line>
  <text x="220" y="274" font-size="10.5" font-weight="700" fill="#c9960f">ask</text>

  <rect x="30" y="257" width="175" height="50" rx="9" fill="#fff8e6" stroke="#c9960f" stroke-width="1.4"></rect>
  <text x="117" y="278" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7a5c00">Block — show prompt</text>
  <text x="117" y="294" text-anchor="middle" font-size="10.5" fill="#7a5c00">waits on a human</text>

  <path d="M30,283 C -20,283 -20,340 60,360" fill="none" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arrow2)"></path>
  <text x="10" y="330" font-size="10" font-weight="700" fill="#c0392b">rejected</text>

  <path d="M117,307 C 117,340 300,375 340,390" fill="none" stroke="#2f9e44" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arrow2)"></path>
  <text x="150" y="335" font-size="10" font-weight="700" fill="#2f9e44">approved</text>

  <!-- error box -->
  <rect x="577" y="257" width="175" height="50" rx="9" fill="#fdeee7" stroke="#e8590c" stroke-width="1.4"></rect>
  <text x="664" y="278" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b8460f">Tool fails</text>
  <text x="664" y="294" text-anchor="middle" font-size="10.5" fill="#b8460f">error → message history</text>

  <!-- execute -->
  <rect x="290" y="362" width="200" height="50" rx="10" fill="#eafaf0" stroke="#2f9e44" stroke-width="1.6"></rect>
  <text x="390" y="384" text-anchor="middle" font-size="13" font-weight="700" fill="#1f7a37">execute(params, ctx)</text>
  <text x="390" y="400" text-anchor="middle" font-size="10.5" fill="#1f7a37">the tool's real side effect</text>

  <line x1="390" y1="412" x2="390" y2="440" stroke="#4a4a4a" stroke-width="1.6" marker-end="url(#arrow2)"></line>

  <!-- output -->
  <rect x="290" y="442" width="200" height="50" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"></rect>
  <text x="390" y="464" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">{ title, output, metadata }</text>
  <text x="390" y="480" text-anchor="middle" font-size="10.5" fill="#6b6b6b">metadata → TUI preview/diff</text>

  <line x1="390" y1="492" x2="390" y2="520" stroke="#4a4a4a" stroke-width="1.6" marker-end="url(#arrow2)"></line>
  <text x="405" y="512" font-size="10.5" fill="#6b6b6b">output string</text>

  <!-- appended to history -->
  <rect x="270" y="522" width="240" height="50" rx="10" fill="#f5f4f2" stroke="#1a1a1a" stroke-width="1.5"></rect>
  <text x="390" y="544" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">Appended to message history</text>
  <text x="390" y="560" text-anchor="middle" font-size="10.5" fill="#6b6b6b">{ role: "tool", ... }</text>

  <path d="M390,572 C 390,610 130,610 130,300" fill="none" stroke="#da3743" stroke-width="1.7" marker-end="url(#arrow2)"></path>
  <text x="70" y="440" font-size="11" font-weight="700" fill="#da3743" transform="rotate(-90 70 440)" text-anchor="middle">LLM called again with updated history</text>

</svg>
