<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" width="780" height="480" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"></path>
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="480" fill="#ffffff"></rect>

  <text x="390" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">
    What Goes Over the Wire, Each Call
  </text>
  <text x="390" y="49" text-anchor="middle" font-size="12.5" fill="#6b6b6b">
    Three buckets sent to the LLM API together — nothing else
  </text>

  <rect x="90" y="65" width="600" height="330" rx="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"></rect>

  <!-- SYSTEM -->
  <rect x="110" y="82" width="560" height="90" rx="9" fill="#fff8e6" stroke="#c9960f" stroke-width="1.4"></rect>
  <text x="390" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5c00">SYSTEM (static — never changes this session)</text>
  <text x="390" y="122" text-anchor="middle" font-size="11" fill="#7a5c00">"You are OpenCode, the best coding agent..."</text>
  <text x="390" y="140" text-anchor="middle" font-size="11" fill="#7a5c00">&lt;env&gt; cwd, platform, date, model &lt;/env&gt;</text>
  <text x="390" y="158" text-anchor="middle" font-size="11" fill="#7a5c00">[contents of AGENTS.md / CLAUDE.md] · [available skills]</text>

  <!-- MESSAGES -->
  <rect x="110" y="182" width="560" height="130" rx="9" fill="#eafaf0" stroke="#2f9e44" stroke-width="1.4"></rect>
  <text x="390" y="202" text-anchor="middle" font-size="13" font-weight="700" fill="#1f7a37">MESSAGES (grows every turn)</text>
  <text x="335" y="222" text-anchor="end" font-size="11" fill="#1f7a37">user:</text>
  <text x="345" y="222" text-anchor="start" font-size="11" fill="#1a1a1a">"refactor the auth module"</text>
  <text x="335" y="240" text-anchor="end" font-size="11" fill="#1f7a37">assistant:</text>
  <text x="345" y="240" text-anchor="start" font-size="11" fill="#1a1a1a">"I'll start by reading auth.ts"</text>
  <text x="335" y="258" text-anchor="end" font-size="11" fill="#1f7a37">tool:</text>
  <text x="345" y="258" text-anchor="start" font-size="11" fill="#1a1a1a">"&lt;file contents of auth.ts&gt;"</text>
  <text x="335" y="276" text-anchor="end" font-size="11" fill="#1f7a37">assistant:</text>
  <text x="345" y="276" text-anchor="start" font-size="11" fill="#1a1a1a">"I'll edit line 42..."</text>
  <text x="335" y="294" text-anchor="end" font-size="11" font-weight="700" fill="#da3743">user:</text>
  <text x="345" y="294" text-anchor="start" font-size="11" font-weight="700" fill="#da3743">← NEW MESSAGE (just appended)</text>

  <!-- TOOLS -->
  <rect x="110" y="322" width="560" height="60" rx="9" fill="#fbeceb" stroke="#da3743" stroke-width="1.4"></rect>
  <text x="390" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">TOOLS (static schemas)</text>
  <text x="390" y="362" text-anchor="middle" font-size="11" fill="#6b6b6b">read: { description, parameters } · edit: { ... } · shell: { ... } · ...</text>

  <line x1="390" y1="395" x2="390" y2="418" stroke="#4a4a4a" stroke-width="1.6" marker-end="url(#arrow3b)"></line>
  <text x="390" y="440" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">LLM decides its next action entirely from this</text>

</svg>
