<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"></path>
    </marker>
    <marker id="arrowo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8590c"></path>
    </marker>
    <marker id="arrowk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"></path>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="620" fill="#ffffff"></rect>

  <text x="410" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">MCP Tools &amp; Data</text>
  <text x="410" y="48" text-anchor="middle" font-size="12.5" fill="#6b6b6b">mcp_server/server.py — the tool boundary in front of the mock "Elasticsearch" index</text>

  <!-- MCP client -->
  <rect x="260" y="63" width="300" height="42" rx="9" fill="#fbeceb" stroke="#da3743" stroke-width="1.5"></rect>
  <text x="410" y="89" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a1a1a">MCP client (chat_service, the harness)</text>

  <line x1="410" y1="105" x2="410" y2="132" stroke="#4a4a4a" stroke-width="1.6" marker-end="url(#arrowk)"></line>
  <text x="410" y="123" text-anchor="middle" font-size="10.5" fill="#6b6b6b">MCP protocol — JSON-RPC over stdio</text>

  <!-- MCP Server container: single row of 4 tools -->
  <rect x="50" y="136" width="720" height="145" rx="12" fill="none" stroke="#9a9a9a" stroke-width="1.4" stroke-dasharray="6,4"></rect>
  <text x="72" y="158" font-size="13.5" font-weight="700" fill="#1a1a1a">MCP Server — mcp_server/server.py</text>

  <rect x="60" y="168" width="165" height="98" rx="9" fill="#eafaf0" stroke="#2f9e44" stroke-width="1.5"></rect>
  <text x="142" y="190" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f7a37">search_restaurants()</text>
  <text x="142" y="207" text-anchor="middle" font-size="9.8" fill="#1f7a37">query / cuisine /</text>
  <text x="142" y="219" text-anchor="middle" font-size="9.8" fill="#1f7a37">neighborhood</text>
  <text x="142" y="248" text-anchor="middle" font-size="9.3" fill="#4d8f5f">READ — safe, call anytime</text>

  <rect x="235" y="168" width="165" height="98" rx="9" fill="#eafaf0" stroke="#2f9e44" stroke-width="1.5"></rect>
  <text x="317" y="190" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f7a37">get_availability()</text>
  <text x="317" y="207" text-anchor="middle" font-size="9.8" fill="#1f7a37">restaurant_id, date,</text>
  <text x="317" y="219" text-anchor="middle" font-size="9.8" fill="#1f7a37">party_size</text>
  <text x="317" y="248" text-anchor="middle" font-size="9.3" fill="#4d8f5f">READ — safe, call anytime</text>

  <rect x="410" y="168" width="165" height="98" rx="9" fill="#fdeee7" stroke="#e8590c" stroke-width="1.5"></rect>
  <text x="492" y="190" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b8460f">create_booking()</text>
  <text x="492" y="207" text-anchor="middle" font-size="9.8" fill="#b8460f">restaurant_id, date, time,</text>
  <text x="492" y="219" text-anchor="middle" font-size="9.8" fill="#b8460f">party_size, customer_name</text>
  <text x="492" y="248" text-anchor="middle" font-size="9.3" fill="#c0511a">WRITE — confirmed first</text>

  <rect x="585" y="168" width="165" height="98" rx="9" fill="#fdeee7" stroke="#e8590c" stroke-width="1.5"></rect>
  <text x="667" y="190" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b8460f">cancel_booking()</text>
  <text x="667" y="207" text-anchor="middle" font-size="9.8" fill="#b8460f">booking_id</text>
  <text x="667" y="248" text-anchor="middle" font-size="9.3" fill="#c0511a">WRITE — confirmed first</text>

  <!-- SQLite / data container -->
  <rect x="50" y="340" width="720" height="220" rx="12" fill="none" stroke="#9a9a9a" stroke-width="1.4" stroke-dasharray="6,4"></rect>
  <text x="72" y="363" font-size="13.5" font-weight="700" fill="#1a1a1a">SQLite — data/restaurant_booking.db (mock "Elasticsearch" index)</text>

  <rect x="80" y="380" width="210" height="145" rx="9" fill="#f5f4f2" stroke="#1a1a1a" stroke-width="1.4"></rect>
  <text x="185" y="405" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">restaurants</text>
  <text x="185" y="425" text-anchor="middle" font-size="10.3" fill="#6b6b6b">name, cuisine,</text>
  <text x="185" y="439" text-anchor="middle" font-size="10.3" fill="#6b6b6b">neighborhood, price_range,</text>
  <text x="185" y="453" text-anchor="middle" font-size="10.3" fill="#6b6b6b">rating, description</text>

  <rect x="310" y="380" width="210" height="145" rx="9" fill="#f5f4f2" stroke="#1a1a1a" stroke-width="1.4"></rect>
  <text x="415" y="405" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">availability</text>
  <text x="415" y="425" text-anchor="middle" font-size="10.3" fill="#6b6b6b">restaurant_id, date, time,</text>
  <text x="415" y="439" text-anchor="middle" font-size="10.3" fill="#6b6b6b">capacity, booked</text>

  <rect x="540" y="380" width="210" height="145" rx="9" fill="#f5f4f2" stroke="#1a1a1a" stroke-width="1.4"></rect>
  <text x="645" y="405" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">bookings</text>
  <text x="645" y="425" text-anchor="middle" font-size="10.3" fill="#6b6b6b">restaurant_id, date, time,</text>
  <text x="645" y="439" text-anchor="middle" font-size="10.3" fill="#6b6b6b">party_size, customer_name,</text>
  <text x="645" y="453" text-anchor="middle" font-size="10.3" fill="#6b6b6b">status</text>

  <!-- primary READ edges (solid gray) -->
  <path d="M142,266 Q 160,325 178,378" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrowg)"></path>
  <text x="122" y="330" font-size="10.5" fill="#6b6b6b" text-anchor="middle">read</text>

  <path d="M317,266 Q 370,325 408,378" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrowg)"></path>
  <text x="345" y="330" font-size="10.5" fill="#6b6b6b" text-anchor="middle">read</text>

  <!-- primary WRITE edges (solid orange) -->
  <path d="M540,266 Q 590,325 620,378" fill="none" stroke="#e8590c" stroke-width="1.8" marker-end="url(#arrowo)"></path>
  <text x="615" y="325" font-size="10.5" fill="#b8460f" text-anchor="middle">insert booking</text>

  <path d="M645,266 Q 655,325 652,378" fill="none" stroke="#e8590c" stroke-width="1.8" marker-end="url(#arrowo)"></path>
  <text x="700" y="300" font-size="10.5" fill="#b8460f" text-anchor="middle">find + set "cancelled"</text>

  <!-- secondary side-effect edges on availability (dashed, thinner) -->
  <path d="M460,266 Q 440,320 435,378" fill="none" stroke="#e8590c" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowo)"></path>
  <text x="430" y="300" font-size="9.8" fill="#b8460f" text-anchor="middle">+ deduct seats</text>

  <path d="M700,266 Q 600,300 460,378" fill="none" stroke="#e8590c" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowo)"></path>
  <text x="590" y="280" font-size="9.8" fill="#b8460f" text-anchor="middle">+ release seats back</text>

  <text x="410" y="600" text-anchor="middle" font-size="10.5" fill="#6b6b6b">Both write tools touch two tables in one call — a real transaction, not just an insert.</text>
</svg>
