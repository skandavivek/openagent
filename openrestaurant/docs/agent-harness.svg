<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"></path>
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="600" fill="#ffffff"></rect>

  <text x="390" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">
    Inside the Agent Harness
  </text>
  <text x="390" y="49" text-anchor="middle" font-size="12.5" fill="#6b6b6b">
    chat_service/main.py — the loop that turns an LLM call into an agent
  </text>

  <!-- Guest message -->
  <rect x="260" y="60" width="240" height="50" rx="10" fill="#fbeceb" stroke="#da3743" stroke-width="1.5"></rect>
  <text x="380" y="90" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">Guest message (chat UI)</text>

  <line x1="380" y1="110" x2="380" y2="138" stroke="#4a4a4a" stroke-width="1.6" marker-end="url(#arrow)"></line>

  <!-- Claude box -->
  <rect x="260" y="140" width="240" height="65" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"></rect>
  <text x="380" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Claude</text>
  <text x="380" y="183" text-anchor="middle" font-size="12" fill="#6b6b6b">reasons over conversation</text>
  <text x="380" y="197" text-anchor="middle" font-size="12" fill="#6b6b6b">+ available tool schemas</text>

  <line x1="380" y1="205" x2="380" y2="232" stroke="#4a4a4a" stroke-width="1.6" marker-end="url(#arrow)"></line>

  <!-- Diamond: tool_use? -->
  <polygon points="380,235 520,290 380,345 240,290" fill="#fff8e6" stroke="#c9960f" stroke-width="1.6"></polygon>
  <text x="380" y="284" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5c00">tool_use</text>
  <text x="380" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5c00">in response?</text>

  <!-- Yes branch: down to Execute -->
  <line x1="380" y1="345" x2="380" y2="368" stroke="#4a4a4a" stroke-width="1.6" marker-end="url(#arrow)"></line>
  <text x="392" y="360" font-size="12" font-weight="700" fill="#2f9e44">yes</text>

  <!-- No branch: right to Final reply -->
  <line x1="520" y1="290" x2="577" y2="288" stroke="#4a4a4a" stroke-width="1.6" marker-end="url(#arrow)"></line>
  <text x="530" y="280" font-size="12" font-weight="700" fill="#c0392b">no</text>

  <!-- Execute MCP tool call -->
  <rect x="260" y="370" width="240" height="60" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"></rect>
  <text x="380" y="394" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">Execute MCP tool call</text>
  <text x="380" y="411" text-anchor="middle" font-size="11.5" fill="#6b6b6b">search / get / create / cancel</text>

  <!-- legend pills -->
  <rect x="430" y="438" width="230" height="25" rx="12.5" fill="#eafaf0" stroke="#2f9e44" stroke-width="1.3"></rect>
  <text x="545" y="454.5" text-anchor="middle" font-size="11.5" fill="#1f7a37">READ tools — safe, call anytime</text>

  <rect x="430" y="470" width="250" height="25" rx="12.5" fill="#fdeee7" stroke="#e8590c" stroke-width="1.3"></rect>
  <text x="555" y="486.5" text-anchor="middle" font-size="11.5" fill="#b8460f">WRITE tools — confirm before calling</text>

  <line x1="430" y1="450" x2="392" y2="418" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"></line>
  <line x1="430" y1="480" x2="392" y2="422" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"></line>

  <line x1="380" y1="430" x2="380" y2="514" stroke="#4a4a4a" stroke-width="1.6" marker-end="url(#arrow)"></line>

  <!-- MCP Server / SQLite -->
  <rect x="260" y="517" width="240" height="60" rx="10" fill="#f5f4f2" stroke="#1a1a1a" stroke-width="1.6"></rect>
  <text x="380" y="541" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">MCP Server → SQLite</text>
  <text x="380" y="558" text-anchor="middle" font-size="11.5" fill="#6b6b6b">(mock Elasticsearch index)</text>

  <!-- Loop back to Claude -->
  <path d="M260,547 C 110,547 110,172 260,172" fill="none" stroke="#da3743" stroke-width="1.8" marker-end="url(#arrow)"></path>
  <text x="60" y="360" font-size="12" font-weight="700" fill="#da3743" transform="rotate(-90 60 360)" text-anchor="middle">tool_result appended to context — ask Claude again</text>

  <!-- Final reply box -->
  <rect x="580" y="260" width="170" height="55" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"></rect>
  <text x="665" y="284" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">Return final</text>
  <text x="665" y="300" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a1a1a">reply</text>

  <line x1="665" y1="315" x2="665" y2="368" stroke="#4a4a4a" stroke-width="1.6" marker-end="url(#arrow)"></line>

  <!-- Shown in chat UI -->
  <rect x="580" y="370" width="170" height="55" rx="10" fill="#fbeceb" stroke="#da3743" stroke-width="1.5"></rect>
  <text x="665" y="394" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Shown in</text>
  <text x="665" y="410" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">chat UI</text>

</svg>
